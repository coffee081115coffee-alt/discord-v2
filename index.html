<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord v13 - The Masterpiece</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Discord 1:1 配色規範 */
        :root {
            --bg-servers: #1e1f22;
            --bg-channels: #2b2d31;
            --bg-chat: #313338;
            --bg-members: #2b2d31;
            --bg-user-bar: #232428;
            --discord-blurple: #5865f2;
            --green-status: #23a559;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --header-primary: #ffffff;
            --channel-hover: rgba(78, 80, 88, 0.3);
            --channel-active: rgba(78, 80, 88, 0.6);
        }

        @font-face { font-family: 'gg sans'; src: local('Segoe UI'), local('Roboto'); }

        * { box-sizing: border-box; outline: none; transition: background-color 0.15s ease, color 0.15s ease, border-radius 0.2s ease; }
        
        body { margin: 0; font-family: 'gg sans', sans-serif; display: flex; height: 100vh; background-color: var(--bg-servers); color: var(--text-normal); overflow: hidden; }

        /* 1. 伺服器列表 (極致動畫) */
        #server-nav { width: 72px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; background-color: var(--bg-servers); }
        .s-item-wrap { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        .s-pill { position: absolute; left: -4px; width: 8px; height: 8px; background: #fff; border-radius: 0 4px 4px 0; opacity: 0; transition: 0.2s; }
        .s-icon { width: 48px; height: 48px; background: #313338; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #23a559; font-size: 20px; text-decoration: none; }
        .s-icon:hover { border-radius: 16px; background: var(--discord-blurple); color: white; }
        .s-item-wrap:hover .s-pill { opacity: 1; height: 20px; }
        .s-icon.active { border-radius: 16px; background: var(--discord-blurple); color: white; }
        .s-icon.active + .s-pill { opacity: 1; height: 40px; }

        /* 2. 頻道列表 (質感修復) */
        #channel-nav { width: 240px; background-color: var(--bg-channels); display: flex; flex-direction: column; border-top-left-radius: 8px; }
        .server-title { height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,0.2); cursor: pointer; }
        .server-title:hover { background-color: rgba(255,255,255,0.05); }
        .c-list { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .c-section { font-size: 12px; font-weight: bold; color: var(--text-muted); padding: 18px 8px 4px; text-transform: uppercase; letter-spacing: 0.2px; }
        .c-row { padding: 6px 8px; margin: 2px 0; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
        .c-row:hover { background: var(--channel-hover); color: var(--text-normal); }
        .c-row.active { background: var(--channel-active); color: #fff; }
        .c-row i { font-size: 1.2em; color: #80848e; }

        /* 個人資訊 (與截圖同步) */
        .user-footer { background: var(--bg-user-bar); height: 52px; padding: 0 8px; display: flex; align-items: center; gap: 8px; }
        .u-avatar-box { width: 32px; height: 32px; border-radius: 50%; position: relative; cursor: pointer; }
        .u-status { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; background: var(--green-status); border: 3px solid var(--bg-user-bar); border-radius: 50%; }
        .u-info-text { flex: 1; cursor: pointer; padding: 4px; border-radius: 4px; overflow: hidden; }
        .u-info-text:hover { background: var(--channel-hover); }
        .u-nick { color: white; font-size: 14px; font-weight: bold; white-space: nowrap; text-overflow: ellipsis; }

        /* 3. 聊天主區 (陰影與細節) */
        #chat-main { flex: 1; background: var(--bg-chat); display: flex; flex-direction: column; position: relative; }
        .chat-top { height: 48px; padding: 0 16px; display: flex; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.1); z-index: 2; font-weight: bold; color: white; gap: 8px; }
        #msg-container { flex: 1; overflow-y: auto; padding: 20px 0; }
        
        /* 訊息佈局 */
        .msg-entry { padding: 2px 16px; display: flex; gap: 16px; margin-top: 1.0625rem; }
        .msg-entry:hover { background: rgba(0,0,0,0.02); }
        .msg-ava { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; margin-top: 4px; }
        .msg-author { color: white; font-weight: 500; cursor: pointer; margin-right: 8px; }
        .msg-author:hover { text-decoration: underline; }
        .msg-date { font-size: 12px; color: var(--text-muted); }
        .msg-body { color: #dbdee1; line-height: 1.375rem; white-space: pre-wrap; margin-top: 2px; }

        /* 輸入框 (深度感) */
        .chat-input-area { padding: 0 16px 24px; flex-shrink: 0; }
        .chat-input-inner { background: #383a40; border-radius: 8px; padding: 11px 16px; display: flex; align-items: center; gap: 16px; }
        #msg-field { background: none; border: none; color: white; flex: 1; font-size: 16px; outline: none; }

        /* 4. 成員名單 (復刻) */
        #member-list { width: 240px; background: var(--bg-members); padding: 24px 8px; flex-shrink: 0; overflow-y: auto; }
        .member-row { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 4px; cursor: pointer; color: var(--text-muted); }
        .member-row:hover { background: var(--channel-hover); color: var(--text-normal); }

        /* 捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* 登入牆 */
        #login-overlay { position: fixed; inset: 0; background: #313338; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <i class="fab fa-discord" style="font-size: 70px; color: var(--discord-blurple); margin-bottom: 20px;"></i>
        <button onclick="login()" style="padding: 12px 32px; background: var(--discord-blurple); color: white; border: none; border-radius: 3px; font-weight: bold; cursor: pointer;">進入避風港</button>
    </div>

    <div id="server-nav">
        <div class="s-item-wrap">
            <div class="s-pill" style="opacity:1; height:40px"></div>
            <div class="s-icon active" style="background:var(--discord-blurple); color:white"><i class="fab fa-discord"></i></div>
        </div>
        <div style="width: 32px; height: 2px; background: #35363c; margin: 4px 0;"></div>
        <div class="s-item-wrap">
            <div class="s-pill"></div>
            <div class="s-icon">S</div>
        </div>
    </div>

    <div id="channel-nav">
        <div class="server-title">𝕊𝕪𝕂_一般人的避風港 <i class="fas fa-chevron-down"></i></div>
        <div class="c-list">
            <div class="c-section">文字頻道</div>
            <div class="c-row active" onclick="switchChannel('一般')"><i class="fas fa-hashtag"></i> 一般</div>
            <div class="c-row" onclick="switchChannel('公告')"><i class="fas fa-hashtag"></i> 公告</div>
            <div class="c-row" onclick="switchChannel('廢文專區')"><i class="fas fa-hashtag"></i> 廢文專區</div>
        </div>
        <div class="user-footer">
            <div class="u-avatar-box">
                <img id="u-ava-img" src="" style="width:100%; border-radius:50%">
                <div class="u-status"></div>
            </div>
            <div class="u-info-text">
                <div id="u-display-name" class="u-nick">載入中...</div>
                <div style="font-size:12px; color:var(--text-muted)">線上</div>
            </div>
            <div style="display:flex; gap:10px; color:var(--text-muted); cursor:pointer">
                <i class="fas fa-microphone"></i><i class="fas fa-cog"></i>
            </div>
        </div>
    </div>

    <div id="chat-main">
        <div class="chat-top"># <span id="current-chan">一般</span></div>
        <div id="msg-container"></div>
        <div class="chat-input-area">
            <div class="chat-input-inner">
                <div style="background:#b5bac1; color:#313338; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; cursor:pointer">+</div>
                <input id="msg-field" type="text" placeholder="傳送訊息..." onkeypress="if(event.key==='Enter')send()">
                <div style="display:flex; gap:12px; color:#b5bac1; cursor:pointer; font-size: 1.2rem;">
                    <i class="fas fa-gift"></i><i class="fas fa-smile"></i>
                </div>
            </div>
        </div>
    </div>

    <div id="member-list">
        <div style="font-size: 12px; font-weight: bold; color: var(--text-muted); padding: 0 8px 8px;">線上 — <span id="online-num">0</span></div>
        <div id="members-list-content"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- 請將此處 Config 替換為你自己的 ---
        const firebaseConfig = {
            apiKey: "AIzaSyD4rw-eMW1Fn4CgK6ho_aB-LYq9GeaXWzw",
            authDomain: "beta-discord.firebaseapp.com",
            projectId: "beta-discord",
            storageBucket: "beta-discord.firebasestorage.app",
            messagingSenderId: "910043477230",
            appId: "1:910043477230:web:399b6bfbdbdd3ef909efff"
        };
        firebase.initializeApp(firebaseConfig);
        const socket = io();
        let user = null;

        function login() { firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }

        firebase.auth().onAuthStateChanged(u => {
            if(u) {
                user = u;
                document.getElementById('u-display-name').innerText = u.displayName;
                document.getElementById('u-ava-img').src = u.photoURL;
                document.getElementById('login-overlay').style.display = 'none';
                socket.emit('join channel', '一般');
                socket.emit('set profile', { name: u.displayName, avatar: u.photoURL });
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        function send() {
            const val = document.getElementById('msg-field').value;
            if(!val.trim()) return;
            socket.emit('chat message', { name: user.displayName, avatar: user.photoURL, text: val, channel: '一般' });
            document.getElementById('msg-field').value = '';
        }

        socket.on('chat message', renderMsg);
        socket.on('load history', docs => { document.getElementById('msg-container').innerHTML = ''; docs.forEach(renderMsg); });
        
        socket.on('update users', users => {
            document.getElementById('online-num').innerText = users.length;
            document.getElementById('members-list-content').innerHTML = users.map(u => `
                <div class="member-row"><img src="${u.avatar}" style="width:32px; height:32px; border-radius:50%"> <span>${u.name}</span></div>
            `).join('');
        });

        function renderMsg(data) {
            const container = document.getElementById('msg-container');
            const div = document.createElement('div');
            div.className = 'msg-entry';
            div.innerHTML = `
                <img class="msg-ava" src="${data.avatar}">
                <div>
                    <div><span class="msg-author">${data.name}</span><span class="msg-date">${data.timeStr || ''}</span></div>
                    <div class="msg-body">${marked.parse(data.text || '')}</div>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function switchChannel(name) {
            document.getElementById('current-chan').innerText = name;
            socket.emit('join channel', name);
            // 這裡可以加上切換 UI 狀態的 code
        }
    </script>
</body>
</html>
