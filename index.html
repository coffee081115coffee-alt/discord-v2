<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>My Cool Discord 6.0</title>
    <style>
        :root { --bg-side: #2b2d31; --bg-main: #313338; --bg-input: #383a40; --text-main: #dbdee1; --discord-blurple: #5865f2; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* 左側欄：頻道 + 個人資料 */
        #sidebar { width: 240px; background-color: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .side-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #1e1f22; color: white; }
        .channel-list { padding: 10px; flex: 1; }
        .channel-item { padding: 10px; border-radius: 4px; cursor: pointer; color: #949ba4; margin-bottom: 2px; }
        .channel-item:hover { background-color: #35373c; color: white; }
        .channel-item.active { background-color: #3f4147; color: white; }
        
        /* 個人資料區 */
        #user-profile-settings { padding: 10px; background: #232428; display: flex; align-items: center; gap: 10px; }
        #user-avatar-display { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        
        /* 中間聊天區 */
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #header { padding: 12px 20px; border-bottom: 1px solid #1e1f22; font-weight: bold; color: white; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        .msg-item { display: flex; gap: 15px; margin-bottom: 16px; position: relative; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; }
        
        /* 右側欄 */
        #user-sidebar { width: 200px; background-color: var(--bg-side); padding: 15px; border-left: 1px solid #1e1f22; }
        .user-item { display: flex; align-items: center; gap: 10px; padding: 6px 0; color: #949ba4; }
        .user-item img { width: 24px; height: 24px; border-radius: 50%; }

        /* 輸入區 */
        #input-area { padding: 20px; background-color: var(--bg-main); }
        .input-box { background-color: var(--bg-input); padding: 10px; border-radius: 8px; display: flex; gap: 10px; }
        input { background: none; border: none; color: white; outline: none; flex: 1; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="side-header">我的伺服器</div>
        <div class="channel-list">
            <div class="channel-item active" onclick="switchChannel('一般', this)"># 一般</div>
            <div class="channel-item" onclick="switchChannel('遊戲討論', this)"># 遊戲討論</div>
            <div class="channel-item" onclick="switchChannel('廢文專區', this)"># 廢文專區</div>
        </div>
        
        <div id="user-profile-settings">
            <img id="user-avatar-display" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" onclick="changeAvatar()">
            <div style="flex:1">
                <input id="my-name" type="text" value="小酷客" style="font-size: 0.8em; width: 100%" onchange="updateProfile()">
            </div>
        </div>
    </div>

    <div id="chat-main">
        <div id="header"># <span id="current-channel-name">一般</span></div>
        <ul id="messages"></ul>
        <div id="input-area">
            <div class="input-box">
                <button onclick="document.getElementById('fileInput').click()" style="background:none; border:none; color:#b5bac1; cursor:pointer; font-size:1.2em">+</button>
                <input type="file" id="fileInput" style="display:none" onchange="sendImg(this)">
                <input id="msg" type="text" placeholder="傳送訊息..." onkeypress="if(event.key==='Enter')send()">
            </div>
        </div>
    </div>

    <div id="user-sidebar">
        <div style="font-size:0.7em; color:#949ba4; margin-bottom:10px">線上成員</div>
        <ul id="user-list" style="list-style:none; padding:0"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentChannel = '一般';
        let myAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

        // 初始化
        socket.emit('join channel', currentChannel);
        updateProfile();

        // 切換頻道
        function switchChannel(name, el) {
            currentChannel = name;
            document.getElementById('current-channel-name').innerText = name;
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('messages').innerHTML = ''; // 清空舊頻道訊息
            socket.emit('join channel', name);
        }

        // 修改個人資料
        function updateProfile() {
            const name = document.getElementById('my-name').value;
            socket.emit('set profile', { name, avatar: myAvatar });
        }

        function changeAvatar() {
            const newUrl = prompt("請貼上圖片網址作為頭像：", myAvatar);
            if(newUrl) {
                myAvatar = newUrl;
                document.getElementById('user-avatar-display').src = newUrl;
                updateProfile();
            }
        }

        socket.on('update users', (users) => {
            const list = document.getElementById('user-list');
            list.innerHTML = users.map(u => `
                <li class="user-item"><img src="${u.avatar}"> ${u.name}</li>
            `).join('');
        });

        socket.on('load history', (docs) => {
            document.getElementById('messages').innerHTML = '';
            docs.forEach(addMessageToUI);
        });

        function send() {
            const msg = document.getElementById('msg').value;
            if (msg.trim()) {
                socket.emit('chat message', { 
                    name: document.getElementById('my-name').value,
                    avatar: myAvatar,
                    text: msg,
                    channel: currentChannel 
                });
                document.getElementById('msg').value = '';
            }
        }

        function addMessageToUI(data) {
            const list = document.getElementById('messages');
            const item = document.createElement('li');
            item.className = 'msg-item';
            item.innerHTML = `
                <img class="msg-avatar" src="${data.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}">
                <div>
                    <div><span style="font-weight:bold; color:white">${data.name}</span> <span style="font-size:0.7em; color:#949ba4">${data.timeStr || ''}</span></div>
                    <div style="margin-top:4px">${data.text || `<img src="${data.image}" style="max-width:200px; border-radius:8px">`}</div>
                </div>
                <button onclick="deleteMsg('${data._id}')" style="position:absolute; right:0; top:0; background:none; border:none; color:#ed4245; cursor:pointer; opacity:0.5">🗑️</button>
            `;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        socket.on('chat message', (data) => {
            if(data.channel === currentChannel) addMessageToUI(data);
        });

        function deleteMsg(id) { if(confirm('刪除？')) socket.emit('delete message', id); }
        socket.on('message deleted', () => { location.reload(); });
    </script>
</body>
</html>
