<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>My Cool Discord 5.0</title>
    <style>
        :root {
            --bg-side: #2b2d31;
            --bg-main: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --discord-blurple: #5865f2;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 左側頻道欄 */
        #sidebar { width: 240px; background-color: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .side-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #1e1f22; color: white; }
        .channel-list { padding: 10px; flex: 1; }
        .channel-item { padding: 8px; border-radius: 4px; cursor: pointer; color: #949ba4; margin-bottom: 2px; }
        .channel-item:hover { background-color: #35373c; color: white; }
        .channel-item.active { background-color: #3f4147; color: white; }

        /* 中間聊天區 */
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #header { padding: 12px 20px; border-bottom: 1px solid #1e1f22; font-weight: bold; color: white; }

        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        #messages li { margin-bottom: 16px; }
        .author { color: #f2f3f5; font-weight: bold; margin-right: 8px; }
        .time { color: #949ba4; font-size: 0.75em; }
        .msg-content { color: #dcddde; margin-top: 4px; word-break: break-all; }

        /* 右側用戶欄 */
        #user-sidebar { width: 200px; background-color: var(--bg-side); padding: 15px; border-left: 1px solid #1e1f22; }
        .user-title { font-size: 0.8em; color: #949ba4; text-transform: uppercase; margin-bottom: 10px; }
        #user-list { list-style: none; padding: 0; }
        .user-item { padding: 6px 0; color: #949ba4; display: flex; align-items: center; }
        .user-item::before { content: "●"; color: #23a559; margin-right: 8px; font-size: 0.8em; }

        /* 輸入區 */
        #input-area { padding: 20px; background-color: var(--bg-main); }
        .input-box { background-color: var(--bg-input); padding: 10px; border-radius: 8px; display: flex; gap: 10px; }
        input { background: none; border: none; color: white; outline: none; flex: 1; font-size: 1em; }
        #name-input { width: 80px; border-right: 1px solid #4e5058; padding-right: 10px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="side-header">我的伺服器</div>
        <div class="channel-list">
            <div class="channel-item active"># 一般</div>
            <div class="channel-item"># 遊戲討論</div>
            <div class="channel-item"># 廢文區</div>
        </div>
    </div>

    <div id="chat-main">
        <div id="header"># 一般</div>
        <ul id="messages"></ul>
        <div id="input-area">
            <div class="input-box">
                <input id="name" type="text" placeholder="暱稱" onchange="updateName()">
                <input id="msg" type="text" placeholder="傳送訊息到 #一般" onkeypress="if(event.key==='Enter')send()">
            </div>
        </div>
    </div>

    <div id="user-sidebar">
        <div class="user-title">在線用戶</div>
        <ul id="user-list"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function updateName() {
            const name = document.getElementById('name').value;
            socket.emit('set nickname', name);
        }

        socket.on('update users', (users) => {
            const list = document.getElementById('user-list');
            list.innerHTML = users.map(u => `<li class="user-item">${u}</li>`).join('');
        });

        socket.on('load history', (docs) => {
            document.getElementById('messages').innerHTML = '';
            docs.forEach(data => addMessageToUI(data));
        });

        function send() {
            const name = document.getElementById('name').value || "無名氏";
            const msg = document.getElementById('msg').value;
            if (msg.trim()) {
                socket.emit('chat message', { name, text: msg });
                document.getElementById('msg').value = '';
                updateName(); // 確保名字有更新
            }
        }

        function addMessageToUI(data) {
            const list = document.getElementById('messages');
            const item = document.createElement('li');
            item.innerHTML = `
                <div>
                    <span class="author">${data.name}</span>
                    <span class="time">${data.timeStr || ''}</span>
                </div>
                <div class="msg-content">${data.text}</div>
            `;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        socket.on('chat message', (data) => addMessageToUI(data));
    </script>
</body>
</html>
