<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>My Cool Discord 4.0</title>
    <style>
        /* --- A. 介面設計 --- */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #313338; color: #dbdee1; display: flex; height: 100vh; flex-direction: column; }
        
        /* 頂部狀態列 */
        #header { background-color: #313338; padding: 12px 20px; border-bottom: 1px solid #1e1f22; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
        .channel-name { font-weight: bold; color: white; font-size: 1.1em; }
        #user-count { font-size: 0.85em; color: #23a559; background: #1e1f22; padding: 4px 10px; border-radius: 12px; }

        /* 訊息區 */
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        #messages li { margin-bottom: 16px; position: relative; transition: background 0.1s; }
        #messages li:hover { background-color: #2e3035; }
        
        .author { color: #5865f2; font-weight: bold; margin-right: 8px; cursor: pointer; }
        .author:hover { text-decoration: underline; }
        .time { color: #949ba4; font-size: 0.75em; }
        .msg-content { margin-top: 4px; color: #dcddde; line-height: 1.4; }
        
        /* 刪除按鈕 */
        .delete-btn { color: #ed4245; background: none; border: none; font-size: 0.7em; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        li:hover .delete-btn { opacity: 1; }

        /* 圖片樣式 */
        .img-msg { max-width: 400px; max-height: 300px; border-radius: 8px; margin-top: 8px; display: block; cursor: zoom-in; border: 1px solid #232428; }

        /* 正在輸入提示 */
        #typing-indicator { padding: 4px 20px; font-size: 0.8em; color: #b5bac1; height: 20px; background: transparent; }

        /* 輸入區域 */
        #input-area { background-color: #2b2d31; padding: 20px; display: flex; gap: 12px; align-items: center; }
        input { background-color: #383a40; border: none; padding: 12px 16px; color: white; border-radius: 8px; outline: none; font-size: 0.95em; }
        #name { width: 80px; text-align: center; font-weight: bold; }
        #msg { flex: 1; }
        
        .action-btn { background-color: #4e5058; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1.2em; transition: 0.2s; }
        .action-btn:hover { background-color: #6d6f78; }
        .send-btn { background-color: #5865f2; font-weight: bold; }
        .send-btn:hover { background-color: #4752c4; }

        /* 捲軸美化 */
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-track { background: #2e3338; }
        #messages::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="header">
        <span class="channel-name"># 一般頻道</span>
        <span id="user-count">● 載入中...</span>
    </div>

    <div id="chat-container">
        <ul id="messages"></ul>
        <div id="typing-indicator"></div>
        <div id="input-area">
            <input id="name" type="text" placeholder="暱稱" maxlength="10" value="小酷客">
            
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="sendImg(this)">
            <button class="action-btn" onclick="document.getElementById('fileInput').click()">📎</button>

            <input id="msg" type="text" placeholder="輸入訊息..." oninput="isTyping()" onkeypress="if(event.key==='Enter')send()">
            <button class="action-btn send-btn" onclick="send()">傳送</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let typingTimer;

        // 1. 在線人數更新
        socket.on('update count', (count) => {
            document.getElementById('user-count').innerText = `● ${count} 人在線上`;
        });

        // 2. 載入歷史紀錄
        socket.on('load history', (docs) => {
            document.getElementById('messages').innerHTML = '';
            docs.forEach(data => addMessageToUI(data));
        });

        // 3. 傳送文字訊息
        function send() {
            const name = document.getElementById('name').value || "無名氏";
            const msg = document.getElementById('msg').value;
            if (msg.trim()) {
                socket.emit('chat message', { name, text: msg });
                document.getElementById('msg').value = '';
            }
        }

        // 4. 傳送圖片訊息
        function sendImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('chat message', {
                        name: document.getElementById('name').value || "無名氏",
                        image: e.target.result
                    });
                };
                reader.readAsDataURL(input.files[0]);
                input.value = ''; 
            }
        }

        // 5. 刪除訊息請求
        function deleteMsg(id) {
            if(confirm('確定要刪除這則訊息嗎？')) {
                socket.emit('delete message', id);
            }
        }

        // 收到刪除通知就重新整理 (簡單暴力有效)
        socket.on('message deleted', () => { location.reload(); });

        // 6. 顯示訊息 UI
        function addMessageToUI(data) {
            // 防當機檢查
            if (!data || (!data.name && !data.text && !data.image)) return;

            const list = document.getElementById('messages');
            const item = document.createElement('li');
            const time = data.timeStr || "剛剛";

            let contentHTML = data.text 
                ? `<div class="msg-content">${data.text}</div>` 
                : `<img class="img-msg" src="${data.image}">`;

            item.innerHTML = `
                <div>
                    <span class="author">${data.name}</span>
                    <span class="time">${time}</span>
                    <button class="delete-btn" onclick="deleteMsg('${data._id}')">🗑️ 刪除</button>
                </div>
                ${contentHTML}
            `;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        socket.on('chat message', (data) => addMessageToUI(data));

        // 7. 正在輸入邏輯
        function isTyping() {
            socket.emit('typing', document.getElementById('name').value || "有人");
        }
        socket.on('user typing', (name) => {
            document.getElementById('typing-indicator').innerText = `${name} 正在輸入...`;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { document.getElementById('typing-indicator').innerText = ''; }, 2000);
        });
    </script>
</body>
</html>
