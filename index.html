<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>My Discord 8.0 - Pro Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <style>
        :root { --bg-side: #2b2d31; --bg-main: #313338; --bg-input: #383a40; --text-main: #dbdee1; --discord-blurple: #5865f2; --danger: #ed4245; }
        body { margin: 0; font-family: 'Whitney', 'Helvetica Neue', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 登入遮罩 - 加上漸層感 */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #23272a 0%, #313338 100%); z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 側邊欄美化 */
        #sidebar { width: 240px; background-color: var(--bg-side); display: flex; flex-direction: column; }
        .side-header { padding: 12px 16px; font-weight: bold; border-bottom: 1px solid #1e1f22; color: white; display: flex; align-items: center; justify-content: space-between; }
        .category-title { font-size: 0.7em; font-weight: bold; color: #949ba4; padding: 18px 10px 8px 16px; text-transform: uppercase; }
        .channel-item { padding: 8px 12px; margin: 2px 8px; border-radius: 4px; cursor: pointer; color: #949ba4; display: flex; align-items: center; gap: 6px; }
        .channel-item::before { content: "#"; font-size: 1.2em; color: #80848e; }
        .channel-item:hover { background: #35373c; color: #dbdee1; }
        .channel-item.active { background: #3f4147; color: white; }

        /* 聊天區美化 */
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #header { padding: 12px 20px; border-bottom: 1px solid #1e1f22; display: flex; align-items: center; gap: 10px; font-weight: bold; color: white; }
        #messages { flex: 1; overflow-y: auto; padding: 10px 0; list-style: none; margin: 0; }
        .msg-item { padding: 8px 20px; display: flex; gap: 16px; position: relative; transition: background 0.1s; }
        .msg-item:hover { background-color: #2e3035; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-top: 2px; }
        .msg-info { display: flex; align-items: baseline; gap: 8px; }
        .author { color: white; font-weight: 500; cursor: pointer; }
        .author:hover { text-decoration: underline; }
        .time { color: #949ba4; font-size: 0.75em; }
        .delete-btn { position: absolute; right: 20px; top: 10px; background: #313338; border: 1px solid #1e1f22; color: var(--danger); border-radius: 4px; cursor: pointer; opacity: 0; padding: 4px 8px; }
        .msg-item:hover .delete-btn { opacity: 1; }

        /* 輸入區美化 */
        #input-area { padding: 0 20px 24px 20px; }
        .input-box { background-color: #383a40; padding: 11px 16px; border-radius: 8px; display: flex; gap: 15px; align-items: center; }
        #msg { background: none; border: none; color: #dbdee1; flex: 1; font-size: 1em; outline: none; }

        /* 個人資料欄位 */
        #user-profile-settings { padding: 10px; background: #232428; display: flex; align-items: center; gap: 10px; }
        #user-avatar-display { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <img src="https://cdn.pixabay.com/photo/2021/02/11/15/40/discord-6005736_1280.png" width="100" style="margin-bottom:20px">
        <h2 style="color:white;">準備好開始聊天了嗎？</h2>
        <button class="login-btn" style="padding:12px 30px; background:var(--discord-blurple); color:white; border:none; border-radius:3px; cursor:pointer; font-weight:bold;" onclick="loginWithGoogle()">使用 Google 登入</button>
    </div>

    <div id="sidebar">
        <div class="side-header">Coffee's World </div>
        <div class="channel-list">
            <div class="category-title">文字頻道</div>
            <div class="channel-item active" onclick="switchChannel('一般', this)">一般</div>
            <div class="channel-item" onclick="switchChannel('遊戲討論', this)">遊戲討論</div>
            <div class="channel-item" onclick="switchChannel('開發日誌', this)">開發日誌</div>
        </div>
        <div id="user-profile-settings">
            <img id="user-avatar-display" src="" onclick="changeAvatar()">
            <input id="my-name" type="text" style="background:none; border:none; color:white; font-size:0.8em; width:80px" onchange="updateProfile()">
        </div>
    </div>

    <div id="chat-main">
        <div id="header"> # <span id="current-channel-name">一般</span></div>
        <ul id="messages"></ul>
        <div id="input-area">
            <div class="input-box">
                <button onclick="document.getElementById('fileInput').click()" style="background:none; border:none; color:#b5bac1; font-size:1.5em; cursor:pointer">+</button>
                <input type="file" id="fileInput" style="display:none" onchange="sendImg(this)">
                <input id="msg" type="text" placeholder="傳送訊息..." onkeypress="if(event.key==='Enter')send()">
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- 1. Firebase 設定 (請確保填入你自己的 Config) ---
        const firebaseConfig = {
    apiKey: "AIzaSyD4rw-eMW1Fn4CgK6ho_aB-LYq9GeaXWzw",
    authDomain: "beta-discord.firebaseapp.com",
    projectId: "beta-discord",
    storageBucket: "beta-discord.firebasestorage.app",
    messagingSenderId: "910043477230",
    appId: "1:910043477230:web:399b6bfbdbdd3ef909efff",
    measurementId: "G-PCVXJ2YJ5S"
    };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const socket = io();
        let currentChannel = '一般';
        let myAvatar = "";

        // --- 2. 自動登入檢查 ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                // 如果已經登入過，自動跳過遮罩
                document.getElementById('my-name').value = user.displayName;
                document.getElementById('user-avatar-display').src = user.photoURL;
                myAvatar = user.photoURL;
                document.getElementById('login-overlay').style.display = 'none';
                socket.emit('join channel', currentChannel);
                updateProfile();
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        function loginWithGoogle() {
            auth.signInWithPopup(provider);
        }

        // --- 3. 頻道與資料 ---
        function switchChannel(name, el) {
            currentChannel = name;
            document.getElementById('current-channel-name').innerText = name;
            document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('messages').innerHTML = '';
            socket.emit('join channel', name);
        }

        function updateProfile() {
            socket.emit('set profile', { name: document.getElementById('my-name').value, avatar: myAvatar });
        }

        function changeAvatar() {
            const url = prompt("貼上圖片網址：", myAvatar);
            if(url) { myAvatar = url; document.getElementById('user-avatar-display').src = url; updateProfile(); }
        }

        // --- 4. 訊息處理 (優化刪除) ---
        function send() {
            const msg = document.getElementById('msg').value;
            if(msg.trim()) {
                socket.emit('chat message', { name: document.getElementById('my-name').value, avatar: myAvatar, text: msg, channel: currentChannel });
                document.getElementById('msg').value = '';
            }
        }

        function addMessageToUI(data) {
            const list = document.getElementById('messages');
            const item = document.createElement('li');
            item.className = 'msg-item';
            item.setAttribute('data-id', data._id); // 標記 ID
            item.innerHTML = `
                <img class="msg-avatar" src="${data.avatar || 'https://rb.gy/9n9smu'}">
                <div style="flex:1">
                    <div class="msg-info">
                        <span class="author">${data.name}</span>
                        <span class="time">${data.timeStr || ''}</span>
                    </div>
                    <div style="color:#dbdee1; margin-top:2px">${data.text || `<img src="${data.image}" style="max-width:300px; border-radius:8px">`}</div>
                </div>
                <button class="delete-btn" onclick="deleteMsg('${data._id}')">🗑️</button>
            `;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        socket.on('chat message', (data) => { if(data.channel === currentChannel) addMessageToUI(data); });
        socket.on('load history', (docs) => { document.getElementById('messages').innerHTML = ''; docs.forEach(addMessageToUI); });

        function deleteMsg(id) {
            if(confirm('確定要刪除？')) socket.emit('delete message', id);
        }

        // --- 優化：收到刪除通知時，只移除該訊息，不重新整理 ---
        socket.on('message deleted', (deletedId) => {
            const msgEl = document.querySelector(`[data-id="${deletedId}"]`);
            if(msgEl) msgEl.remove();
            // 如果後端沒回傳 ID，這行 location.reload() 可以暫留作為保險
            // 但建議後端修改 io.emit('message deleted', id);
        });
    </script>
</body>
</html>
