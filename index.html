<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>My Cool Discord 5.0 - Full Power</title>
    <style>
        :root {
            --bg-side: #2b2d31;
            --bg-main: #313338;
            --bg-input: #383a40;
            --text-main: #dbdee1;
            --discord-blurple: #5865f2;
            --danger: #ed4245;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* 左側頻道欄 */
        #sidebar { width: 240px; background-color: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .side-header { padding: 12px; font-weight: bold; border-bottom: 1px solid #1e1f22; color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .channel-list { padding: 10px; flex: 1; }
        .channel-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; color: #949ba4; margin-bottom: 2px; transition: 0.2s; }
        .channel-item:hover { background-color: #35373c; color: white; }
        .channel-item.active { background-color: #3f4147; color: white; }

        /* 中間聊天區 */
        #chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #header { padding: 12px 20px; border-bottom: 1px solid #1e1f22; font-weight: bold; color: white; display: flex; justify-content: space-between; }
        
        #messages { flex: 1; overflow-y: auto; padding: 20px; list-style: none; margin: 0; }
        #messages li { margin-bottom: 16px; position: relative; padding: 4px 8px; border-radius: 4px; }
        #messages li:hover { background-color: #2e3035; }
        
        .author { color: var(--discord-blurple); font-weight: bold; margin-right: 8px; }
        .time { color: #949ba4; font-size: 0.75em; }
        .msg-content { color: #dcddde; margin-top: 4px; word-break: break-all; }
        .img-msg { max-width: 300px; border-radius: 8px; margin-top: 8px; display: block; border: 1px solid #232428; }

        /* 刪除按鈕 */
        .delete-btn { position: absolute; right: 10px; top: 10px; background: #383a40; color: var(--danger); border: 1px solid #1e1f22; border-radius: 4px; cursor: pointer; opacity: 0; padding: 2px 6px; font-size: 0.7em; }
        li:hover .delete-btn { opacity: 1; }

        /* 正在輸入提示 */
        #typing-indicator { padding: 2px 20px; font-size: 0.75em; color: #b5bac1; min-height: 18px; }

        /* 右側用戶欄 */
        #user-sidebar { width: 200px; background-color: var(--bg-side); padding: 15px; border-left: 1px solid #1e1f22; }
        .user-title { font-size: 0.75em; color: #949ba4; text-transform: uppercase; margin-bottom: 10px; font-weight: bold; }
        #user-list { list-style: none; padding: 0; margin: 0; }
        .user-item { padding: 6px 8px; color: #949ba4; display: flex; align-items: center; border-radius: 4px; }
        .user-item::before { content: "●"; color: #23a559; margin-right: 8px; font-size: 0.8em; }

        /* 輸入區 */
        #input-area { padding: 0 20px 20px 20px; background-color: var(--bg-main); }
        .input-box { background-color: var(--bg-input); padding: 10px 15px; border-radius: 8px; display: flex; gap: 12px; align-items: center; }
        input { background: none; border: none; color: white; outline: none; flex: 1; font-size: 0.95em; }
        #name { width: 80px; border-right: 1px solid #4e5058; padding-right: 10px; font-weight: bold; }
        
        .action-btn { background: none; border: none; font-size: 1.4em; cursor: pointer; color: #b5bac1; transition: 0.2s; padding: 0; }
        .action-btn:hover { color: white; }
        
        /* 捲軸美化 */
        #messages::-webkit-scrollbar { width: 8px; }
        #messages::-webkit-scrollbar-thumb { background: #1e1f22; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="side-header">My Server</div>
        <div class="channel-list">
            <div class="channel-item active"># 一般</div>
            <div class="channel-item"># 遊戲討論</div>
            <div class="channel-item"># 測試頻道</div>
        </div>
    </div>

    <div id="chat-main">
        <div id="header">
            <span># 一般</span>
            <span id="user-count" style="font-size: 0.8em; color: #23a559;">● 連線中...</span>
        </div>
        
        <ul id="messages"></ul>
        
        <div id="typing-indicator"></div>

        <div id="input-area">
            <div class="input-box">
                <input id="name" type="text" placeholder="暱稱" maxlength="10" onchange="updateNickname()">
                
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="sendImg(this)">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()">⊕</button>
                
                <input id="msg" type="text" placeholder="傳送訊息到 #一般" oninput="isTyping()" onkeypress="if(event.key==='Enter')send()">
            </div>
        </div>
    </div>

    <div id="user-sidebar">
        <div class="user-title">在線用戶 — <span id="count-num">0</span></div>
        <ul id="user-list"></ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let typingTimer;

        // 1. 設定暱稱
        function updateNickname() {
            const name = document.getElementById('name').value || "無名氏";
            socket.emit('set nickname', name);
        }

        // 2. 更新用戶清單
        socket.on('update users', (users) => {
            document.getElementById('count-num').innerText = users.length;
            document.getElementById('user-count').innerText = `● ${users.length} 人在線上`;
            const list = document.getElementById('user-list');
            list.innerHTML = users.map(u => `<li class="user-item">${u}</li>`).join('');
        });

        // 3. 載入歷史
        socket.on('load history', (docs) => {
            document.getElementById('messages').innerHTML = '';
            docs.forEach(data => addMessageToUI(data));
        });

        // 4. 傳送文字
        function send() {
            const name = document.getElementById('name').value || "無名氏";
            const msg = document.getElementById('msg').value;
            if (msg.trim()) {
                socket.emit('chat message', { name, text: msg });
                document.getElementById('msg').value = '';
                updateNickname();
            }
        }

        // 5. 傳送圖片
        function sendImg(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('chat message', {
                        name: document.getElementById('name').value || "無名氏",
                        image: e.target.result
                    });
                };
                reader.readAsDataURL(input.files[0]);
                input.value = ''; 
            }
        }

        // 6. 刪除功能
        function deleteMsg(id) {
            if(confirm('確定要刪除嗎？')) socket.emit('delete message', id);
        }
        socket.on('message deleted', () => { location.reload(); });

        // 7. 顯示 UI
        function addMessageToUI(data) {
            if (!data) return;
            const list = document.getElementById('messages');
            const item = document.createElement('li');
            
            let contentHTML = data.text 
                ? `<div class="msg-content">${data.text}</div>` 
                : `<img class="img-msg" src="${data.image}">`;

            item.innerHTML = `
                <div>
                    <span class="author">${data.name}</span>
                    <span class="time">${data.timeStr || '剛剛'}</span>
                    <button class="delete-btn" onclick="deleteMsg('${data._id}')">🗑️</button>
                </div>
                ${contentHTML}
            `;
            list.appendChild(item);
            list.scrollTop = list.scrollHeight;
        }

        socket.on('chat message', (data) => addMessageToUI(data));

        // 8. 正在輸入
        function isTyping() {
            socket.emit('typing', document.getElementById('name').value || "有人");
        }
        socket.on('user typing', (name) => {
            document.getElementById('typing-indicator').innerText = `${name} 正在輸入...`;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { document.getElementById('typing-indicator').innerText = ''; }, 2000);
        });
    </script>
</body>
</html>
