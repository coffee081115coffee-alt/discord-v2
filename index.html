<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Coffee Discord Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root { --bg-side: #2b2d31; --bg-main: #313338; --bg-input: #383a40; --text-main: #dbdee1; --discord-blurple: #5865f2; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* 登入畫面 */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #313338; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 側邊欄 */
        #sidebar { width: 240px; background: var(--bg-side); display: flex; flex-direction: column; border-right: 1px solid #1e1f22; }
        .channel-item { padding: 10px 15px; margin: 2px 8px; border-radius: 4px; cursor: pointer; color: #949ba4; }
        .channel-item:hover { background: #35373c; color: white; }
        .channel-item.active { background: #3f4147; color: white; font-weight: bold; }
        .channel-item::before { content: "# "; opacity: 0.5; }

        /* 聊天區域 */
        #chat-main { flex: 1; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 20px 0; }
        .msg-item { padding: 5px 20px; display: flex; gap: 15px; position: relative; }
        .msg-item:hover { background: #2e3035; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; }
        .msg-content { flex: 1; }
        .msg-header { display: flex; align-items: baseline; gap: 10px; }
        .msg-user { color: white; font-weight: bold; }
        .msg-time { color: #949ba4; font-size: 0.7em; }
        
        /* 訊息工具列 (回覆、刪除) */
        .msg-tools { position: absolute; right: 20px; top: 5px; display: none; background: #313338; border: 1px solid #1e1f22; border-radius: 4px; }
        .msg-item:hover .msg-tools { display: flex; }
        .tool-btn { padding: 5px 10px; cursor: pointer; background: none; border: none; color: #b5bac1; }
        .tool-btn:hover { color: white; background: #3f4147; }

        /* 輸入框 */
        #input-area { padding: 20px; }
        .input-box { background: #383a40; padding: 10px 15px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
        #msg-input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 1em; }

        /* 回覆預覽 */
        #reply-bar { display: none; background: #2b2d31; padding: 5px 20px; font-size: 0.8em; border-radius: 8px 8px 0 0; margin: 0 20px; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h2 style="color:white">Coffee Discord</h2>
        <button onclick="login()" style="padding:10px 25px; background:var(--discord-blurple); color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Google 帳號登入</button>
    </div>

    <div id="sidebar">
        <div style="padding:15px; font-weight:bold; color:white; border-bottom:1px solid #1e1f22">伺服器頻道</div>
        <div id="chan-一般" class="channel-item active" onclick="switchChannel('一般')">一般</div>
        <div id="chan-聊天專區" class="channel-item" onclick="switchChannel('聊天專區')">聊天專區</div>
        <div id="chan-語音測試" class="channel-item" onclick="switchChannel('語音測試')">語音測試</div>
    </div>

    <div id="chat-main">
        <div style="padding:12px 20px; border-bottom: 1px solid #1e1f22; font-weight:bold;"># <span id="chan-title">一般</span></div>
        <div id="messages"></div>
        
        <div id="reply-bar">
            <span>正在回覆 <strong id="reply-name"></strong></span>
            <button onclick="cancelReply()" style="background:none; border:none; color:white; cursor:pointer">✕</button>
        </div>
        
        <div id="input-area">
            <div class="input-box">
                <input id="msg-input" type="text" placeholder="輸入訊息..." onkeypress="if(event.key==='Enter')send()">
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- 請確保這裡的 Config 是你的 ---
        const firebaseConfig = {
        apiKey: "AIzaSyD4rw-eMW1Fn4CgK6ho_aB-LYq9GeaXWzw",
        authDomain: "beta-discord.firebaseapp.com",
        projectId: "beta-discord",
        storageBucket: "beta-discord.firebasestorage.app",
        messagingSenderId: "910043477230",
        appId: "1:910043477230:web:399b6bfbdbdd3ef909efff",
        measurementId: "G-PCVXJ2YJ5S"
    };
        firebase.initializeApp(firebaseConfig);
        
        const socket = io();
        let myUser = null;
        let currentChannel = '一般';
        let replyData = null;

        // 登入邏輯
        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider);
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                myUser = user;
                document.getElementById('login-overlay').style.display = 'none';
                socket.emit('join channel', currentChannel);
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        // 頻道切換
        function switchChannel(name) {
            currentChannel = name;
            document.getElementById('chan-title').innerText = name;
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.getElementById('chan-' + name).classList.add('active');
            document.getElementById('messages').innerHTML = '';
            socket.emit('join channel', name);
        }

        // 傳送訊息
        function send() {
            const text = document.getElementById('msg-input').value;
            if (!text.trim()) return;

            socket.emit('chat message', {
                name: myUser.displayName,
                avatar: myUser.photoURL,
                text: text,
                channel: currentChannel,
                replyTo: replyData
            });

            document.getElementById('msg-input').value = '';
            cancelReply();
        }

        // 渲染訊息
        function addMessage(data) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'msg-item';
            div.dataset.id = data._id;

            // 處理 Markdown
            const htmlText = marked.parse(data.text || '');

            let replyInfo = data.replyTo ? `<div style="font-size:0.8em; color:#b5bac1; margin-bottom:4px">↪ 回覆 ${data.replyTo.name}: ${data.replyTo.text.substring(0,15)}...</div>` : '';

            div.innerHTML = `
                <img class="msg-avatar" src="${data.avatar}">
                <div class="msg-content">
                    ${replyInfo}
                    <div class="msg-header">
                        <span class="msg-user">${data.name}</span>
                        <span class="msg-time">${data.timeStr || ''}</span>
                    </div>
                    <div style="color:#dbdee1">${htmlText}</div>
                </div>
                <div class="msg-tools">
                    <button class="tool-btn" onclick="setReply('${data._id}', '${data.name}', '${data.text}')">↩️</button>
                    <button class="tool-btn" onclick="deleteMsg('${data._id}')">🗑️</button>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        socket.on('chat message', data => { if(data.channel === currentChannel) addMessage(data); });
        socket.on('load history', docs => { docs.forEach(addMessage); });
        socket.on('message deleted', id => { document.querySelector(`[data-id="${id}"]`)?.remove(); });

        function setReply(id, name, text) {
            replyData = { id, name, text };
            document.getElementById('reply-bar').style.display = 'flex';
            document.getElementById('reply-name').innerText = name;
        }
        function cancelReply() { replyData = null; document.getElementById('reply-bar').style.display = 'none'; }
        function deleteMsg(id) { if(confirm('刪除？')) socket.emit('delete message', id); }
    </script>
</body>
</html>
